 var w=window.innerWidth,h=window.innerHeight,sc=Math.min(w/W,h/H),cw=Math.floor(W*sc),ch=Math.floor(H*sc);
 cv.style.width=cw+"px";cv.style.height=ch+"px";cv.style.left=Math.floor((w-cw)/2)+"px";cv.style.top=Math.floor((h-ch)/2)+"px";
 var r=clamp(sc*(window.devicePixelRatio||1),1,1.5),nw=Math.round(W*r),nh=Math.round(H*r);RES=r;
 if(cv.width!==nw||cv.height!==nh){cv.width=nw;cv.height=nh}
 rotOn=touchMode&&h>w&&w<640&&!rotDismissed;rotEl.style.display=rotOn?"flex":"none";
 if(rotOn&&scene==="play"&&G&&!G.paused)pause()
}
window.addEventListener("resize",fit);window.addEventListener("orientationchange",function(){setTimeout(fit,150)});
if(window.visualViewport)visualViewport.addEventListener("resize",fit);
document.addEventListener("fullscreenchange",fit);document.addEventListener("webkitfullscreenchange",fit);
fit();
if(touchMode&&!store.get("hb-help",false))scene="help";
cv.addEventListener("wheel",function(e){if(scene==="menu"){sel=clamp(sel+(e.deltaY>0?1:-1),0,list.length-1);e.preventDefault()}},{passive:false});
var KMAP={ArrowLeft:0,KeyA:0,KeyJ:0,ArrowDown:1,KeyS:1,KeyK:1,ArrowUp:2,KeyW:2,KeyI:2,ArrowRight:3,KeyD:3,KeyL:3};
window.addEventListener("keydown",function(e){
 if(e.repeat){if(KMAP[e.code]!=null||e.code==="Enter")e.preventDefault();return}
 initAudio();
 if(scene==="play"){
  if(e.code==="Escape"||e.code==="KeyP"){pause();e.preventDefault();return}
  if(e.code==="KeyV"){showCue=!showCue;e.preventDefault();return}
  if(KMAP[e.code]!=null&&!G.paused){press(KMAP[e.code]);e.preventDefault()}
 }else if(scene==="menu"){
  if(e.code==="ArrowDown"||e.code==="KeyS"){sel=Math.min(list.length-1,sel+1)}else if(e.code==="ArrowUp"||e.code==="KeyW"){sel=Math.max(0,sel-1)}
  else if(e.code==="ArrowLeft"||e.code==="KeyA"){diff=Math.max(0,diff-1)}else if(e.code==="ArrowRight"||e.code==="KeyD"){diff=Math.min(2,diff+1)}
  else if(e.code==="Tab"){swapPlayer(list[sel])}
  else if(e.code==="BracketLeft"){nudgeSync(list[sel],-.1)}else if(e.code==="BracketRight"){nudgeSync(list[sel],.1)}
  else if(e.code==="KeyH"){helpTab=1;scene="help"}else if(e.code==="Enter"||e.code==="Space"){playSel()}else return;
  e.preventDefault()
 }else if(scene==="help"){
  if(e.code==="Enter"||e.code==="Escape"||e.code==="Space"||e.code==="KeyH"){closeHelp();e.preventDefault()}
 }else if(scene==="results"||scene==="over"){
  if(e.code==="Enter")loadAndStart(G.song,G.diff);else if(e.code==="Escape")scene="menu"
 }
});
window.addEventListener("keyup",function(e){if(KMAP[e.code]!=null)release(KMAP[e.code])});
window.addEventListener("blur",function(){if(scene==="play"&&!G.paused)pause()});
// test hooks
window.__hb={
 SING:SING,ownersAt:ownersAt,cueTime:cueTime,synthK:synthK,nudgeSync:nudgeSync,SYNC:SYNC,ci:ci,ENSEMBLE:ENSEMBLE,pickOpp:pickOpp,applyCues:applyCues,swapPlayer:swapPlayer,ensurePlayable:ensurePlayable,CHARS:CHARS,
 start:function(i,d,bot){fake=true;fakeT=100;clock=0;sel=i;diff=d;var s=list[i];var notes=genChart(s,d);ensurePlayable(s,notes,synthK(s));resetG(s,notes,d,null);G.bot=!!bot;G.t0=T()+2;G.songT=-2;scene="play"},
 step:function(sec,n){n=n||1;for(var k=0;k<n;k++){fakeT+=sec;clock+=sec;shake=Math.max(0,shake-sec*2);update(sec)}draw()},
 press:press,release:release,get:function(){return{scene:scene,G:G&&{score:G.score,combo:G.combo,max:G.maxCombo,health:G.health,counts:G.counts,miss:G.miss,total:G.total,songT:G.songT,endT:G.endT,notes:G.notes.length}}},
 scene:function(s){scene=s;draw()},drawNow:draw,setSel:function(i){sel=i},chartAudio:chartAudio,genChart:genChart,end:function(w){endSong(w)},SONGS:SONGS
};
requestAnimationFrame(frame);
})();
