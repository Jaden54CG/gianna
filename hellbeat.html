(function(){
 function ts(x){var m=x.trim().split(":");return(+m[0])*60+(+m[1])}

 });
})();
function ci(name){
 var n=name.toLowerCase().trim(),i;
 for(i=0;i<CHARS.length;i++)if(CHARS[i].n.toLowerCase()===n)return i;
 if(ALIAS[n]!=null){var al=ALIAS[n].toLowerCase();for(i=0;i<CHARS.length;i++)if(CHARS[i].n.toLowerCase()===al)return i}
 for(i=0;i<CHARS.length;i++)if(CHARS[i].n.toLowerCase().indexOf(n)>=0)return i;
 return -1
}
function singShare(slug,c){var d=SING[slug];return d&&d.sum?(d.tot[c]||0)/d.sum:0}
/* ---- who is singing at time t ----
   Exact: a listed line contains t (start inclusive, end exclusive, no padding), so a hand-off from A to B switches on the listed second.
   Otherwise the nearest listed line within NEAR seconds owns it (vocal tails, ad-libs, timestamps that are a hair early/late).
   Further than that it is a break with no singer (null). */
function ownersAt(d,t){
 var ex=null,bd=1e9,bn=null,i,sg,dist;
 for(i=0;i<d.seg.length;i++){
  sg=d.seg[i];
  if(t>=sg[0]&&t<sg[1]){ex=ex||[];if(ex.indexOf(sg[2])<0)ex.push(sg[2])}
  else{dist=t<sg[0]?sg[0]-t:t-sg[1];
   if(dist<bd-1e-6){bd=dist;bn=[sg[2]]}else if(Math.abs(dist-bd)<=1e-6&&bn&&bn.indexOf(sg[2])<0)bn.push(sg[2])}
 }

}
/* Per-song nudge (seconds, saved): if your audio runs a little ahead/behind the timestamps, shift every singer cue by this much.

 var d=SING[song.slug];if(!d||!d.seg.length)return notes;var pl=song.p||0;
 notes.forEach(function(n){var o=ownersAt(d,cueTime(song,n.t,k));n.side=(o&&o.c.indexOf(pl)>=0)?1:0});return notes
}
function pickOpp(song){
 var d=SING[song.slug],pl=song.p||0,i;if(!d)return song.char;
 for(i=0;i<d.rank.length;i++)if(d.rank[i]!==pl&&ENSEMBLE.indexOf(CHARS[d.rank[i]].n)<0)return d.rank[i];

}

}
SONGS.forEach(function(song){
 var d=SING[song.slug];if(!d)return;var want=DEFAULT_P[song.t]!=null?ci(DEFAULT_P[song.t]):song.p||0;
 var pk=asPick[song.slug];if(pk!=null&&d.elig.indexOf(pk)>=0)want=pk;

});

function ensurePlayable(song,notes,k){
 var d=SING[song.slug];if(!d)return;applyCues(song,notes,k);
 var cnt=function(){return notes.filter(function(n){return n.side===1}).length};
 if(cnt()>=10){song.baseChar=song.char;return}

 d.elig.forEach(function(c){song.p=c;applyCues(song,notes,k);var q=cnt();if(q>bestN){bestN=q;bestC=c}});
 song.p=bestC;applyCues(song,notes,k);song.char=pickOpp(song);song.baseChar=song.char;

 var d=SING[G.song.slug];if(!d)return;var o=ownersAt(d,cueTime(G.song,G.songT,G.cueK)),pl=G.song.p||0;

}

var ac=null,master=null,noiseBuf=null,muted=store.get("hh-mute",false),fake=false,fakeT=0;
function initAudio(){

 try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:.8;master.connect(ac.destination);
  var n=ac.sampleRate*1,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;noiseBuf=b}catch(e){ac=null}
 if(ac&&ac.state==="suspended")ac.resume()
}
function setMute(m){muted=m;store.set("hh-mute",m);if(master)master.gain.value=m?0:.8}
function mf(m){return 440*Math.pow(2,(m-69)/12)}
function tone(f,t,d,type,v,dest,slide){
 if(!ac||fake)return;var o=ac.createOscillator(),gn=ac.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);

 o.connect(gn);gn.connect(dest||master);o.start(t);o.stop(t+d+.05)
}
