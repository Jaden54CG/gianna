<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizza Inferno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Limelight&display=swap">
<style>
:root {
  --ink: #0a0407; --blood: #b3122b; --ember: #ff3d4f; --gold: #e8c26a; --bone: #f6ebdd;
  --font-display: "Limelight", Georgia, serif;
  --font-body: "Josefin Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--ink);
  background-image: radial-gradient(120% 75% at 50% 0%, #3d0b18 0%, var(--ink) 62%);
  background-repeat: no-repeat; background-attachment: fixed;
  color: var(--bone); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
}
.app { max-width: 540px; margin: 0 auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.hud { display: flex; gap: 8px; }
.stat { flex: 1; text-align: center; padding: .4rem .3rem; border: 1px solid rgba(232,194,106,.6); background: rgba(10,4,7,.7); }
.stat small { display: block; font-size: .58rem; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
.stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; line-height: 1.2; color: #ffe9ee; text-shadow: 0 0 8px var(--ember); }
.card {
  position: relative; padding: 1rem .9rem 1.1rem; display: flex; flex-direction: column; align-items: center; gap: .8rem; text-align: center;
  background: linear-gradient(180deg, rgba(43,8,17,.86), rgba(14,3,7,.92));
  border: 2px solid var(--gold); box-shadow: 0 0 40px rgba(179,18,43,.35), inset 0 0 40px rgba(0,0,0,.55);
}
.title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 10vw, 3rem); line-height: 1.05; color: #ffe9ee; text-shadow: 0 0 6px #ff6b7d, 0 0 22px var(--ember), 0 0 44px var(--blood); }
.sub { margin: 0; max-width: 36ch; color: rgba(246,235,221,.82); font-weight: 300; font-size: 1.02rem; }
.mini { margin: 0; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.who { display: flex; align-items: center; gap: .7rem; }
.face { font-size: 2.6rem; line-height: 1; }
.who b { font-size: 1.2rem; letter-spacing: .06em; }
.ticket {
  width: 100%; max-width: 380px; text-align: left; padding: .9rem 1rem; font-size: 1.02rem;
  background: #f6ebdd; color: #2a0b14; border: 2px dashed #b3122b; box-shadow: 0 6px 18px rgba(0,0,0,.5);
}
.ticket p { margin: 0 0 .5rem; font-weight: 600; }
.ticket ul { margin: 0; padding-left: 1.1rem; }
.ticket li { margin: .15rem 0; }
.slot { width: min(100%, 260px); }
.slot svg { display: block; width: 100%; height: auto; overflow: visible; }
.row { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; width: 100%; }
.btn {
  cursor: pointer; font: 700 .85rem/1 var(--font-body); letter-spacing: .18em; text-transform: uppercase;
  padding: 1rem 1.5rem; border: 2px solid var(--gold); border-radius: 2px; color: var(--bone); background: transparent;
  transition: transform .2s, background .2s;
}
.btn:hover { transform: translateY(-2px); }
.btn:focus-visible, .chip:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn.yes { background: linear-gradient(180deg, var(--ember), var(--blood)); box-shadow: 0 0 22px rgba(255,61,79,.55); }
.btn.no:hover { background: rgba(232,194,106,.14); }
.btn.sm { padding: .8rem 1rem; font-size: .75rem; }
.chip {
  display: inline-flex; align-items: center; gap: .45rem; cursor: pointer;
  font: 600 .88rem/1.1 var(--font-body); letter-spacing: .04em; color: var(--bone);
  padding: .65rem .8rem; background: rgba(10,4,7,.7); border: 1px solid rgba(232,194,106,.6); border-radius: 2px;
}
.chip.on { background: linear-gradient(180deg, var(--ember), var(--blood)); border-color: var(--gold); box-shadow: 0 0 14px rgba(255,61,79,.55); }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); flex: none; }
.meter { position: relative; width: 100%; max-width: 380px; height: 24px; border: 2px solid var(--gold); background: rgba(10,4,7,.8); overflow: hidden; }
.meter .zone { position: absolute; top: 0; bottom: 0; background: rgba(90,200,120,.45); border-left: 2px solid #7dffa0; border-right: 2px solid #7dffa0; }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #ff9f1c, var(--ember)); opacity: .85; }
.quip { margin: 0; min-height: 1.4em; color: var(--gold); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: .8rem; }
.stars { margin: 0; font-size: 2rem; letter-spacing: .15em; color: var(--gold); text-shadow: 0 0 14px rgba(232,194,106,.7); }
.break { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 340px; }
.break li { display: flex; justify-content: space-between; gap: 1rem; padding: .3rem 0; border-bottom: 1px solid rgba(232,194,106,.25); font-weight: 600; }
.break li span:last-child { color: var(--gold); }
.big { margin: 0; font-family: var(--font-display); font-size: clamp(2.6rem, 14vw, 4rem); color: #ffe9ee; text-shadow: 0 0 8px #ff6b7d, 0 0 30px var(--ember); line-height: 1; }
#cuts line { stroke-dasharray: 190; stroke-dashoffset: 0; }
#cuts.draw line { animation: cutin .5s ease-out both; }
@keyframes cutin { from { stroke-dashoffset: 190; } to { stroke-dashoffset: 0; } }
#cuts.preview { opacity: .45; }
#cuts.preview line { stroke-dasharray: 6 6; }
#sauce, #cheese { transition: opacity .25s; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="stat"><small>Customer</small><b id="hCust">0 / 5</b></div>
    <div class="stat"><small>Score</small><b id="hScore">0</b></div>
  </div>

  <section class="card" id="sStart">
    <h1 class="title">Pizza Inferno</h1>
    <p class="sub">Five hungry customers a shift. Build the pizza they ask for, bake it just right, cut it, and serve it.</p>
    <button class="btn yes" id="bStart" type="button">Open for business</button>
  </section>

  <section class="card" id="sOrder" hidden>
    <div class="who"><span class="face" id="oFace"></span><b id="oName"></b></div>
    <div class="ticket" id="oTicket"></div>
    <button class="btn yes" id="bCook" type="button">Start cooking</button>
  </section>

  <section class="card" id="sBuild" hidden>
    <p class="mini" id="bTicket"></p>
    <div class="slot" id="slotBuild"></div>
    <div class="row" id="sauces"></div>
    <div class="row"><button class="chip" id="bCheese" type="button" aria-pressed="false">Cheese: off</button></div>
    <p class="mini">Pick a topping, then tap the pizza to place it</p>
    <div class="row" id="tops"></div>
    <div class="row">
      <button class="btn no sm" id="bUndo" type="button">Undo</button>
      <button class="btn no sm" id="bClear" type="button">Clear</button>
      <button class="btn yes sm" id="bOven" type="button">To the oven</button>
    </div>
  </section>

  <section class="card" id="sBake" hidden>
    <p class="mini" id="kTicket"></p>
    <div class="slot" id="slotBake"></div>
    <div class="meter" id="meter" aria-hidden="true"><div class="zone" id="zone"></div><div class="fill" id="fill"></div></div>
    <p class="quip" id="kLabel" aria-live="polite"></p>
    <button class="btn yes" id="bPull" type="button">Pull it out</button>
  </section>

  <section class="card" id="sCut" hidden>
    <p class="mini" id="cTicket"></p>
    <div class="slot" id="slotCut"></div>
    <div class="row" id="cutOpts"></div>
    <button class="btn yes" id="bCut" type="button">Cut it</button>
  </section>

  <section class="card" id="sServe" hidden>
    <div class="who"><span class="face" id="rFace"></span><b id="rName"></b></div>
    <p class="stars" id="rStars" aria-live="polite"></p>
    <p class="sub" id="rSay"></p>
    <ul class="break" id="rBreak"></ul>
    <button class="btn yes" id="bNext" type="button">Next customer</button>
  </section>

  <section class="card" id="sEnd" hidden>
    <h2 class="title">Shift over</h2>
    <p class="big" id="eScore"></p>
    <p class="sub" id="eRank"></p>
    <button class="btn yes" id="bAgain" type="button">Play again</button>
  </section>
</div>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var NS = "http://www.w3.org/2000/svg";
  var CUSTOMERS = [["😈", "Mr. Cinder"], ["👹", "Lady Ash"], ["👻", "Sir Wisp"], ["🤡", "Madame Hex"], ["💀", "Grim Gary"], ["🐲", "Brimstone Bea"], ["🦇", "Count Flutter"], ["🧛", "Baron Gloom"]];
  var SAUCES = [{ k: "tomato", n: "Tomato", c: "#c0392b" }, { k: "cream", n: "Cream", c: "#f4ead0" }, { k: "ember", n: "Ember", c: "#ff6a1a" }];
  var TOPS = [{ k: "pep", n: "Pepperoni", c: "#b3122b" }, { k: "mush", n: "Mushroom", c: "#e8dcc8" }, { k: "olive", n: "Olive", c: "#20202a" }, { k: "pepper", n: "Pepper", c: "#3fa34d" }, { k: "onion", n: "Onion", c: "#e4cdf0" }];
  var BAKES = [{ n: "light", t: 45 }, { n: "golden", t: 62 }, { n: "crispy", t: 80 }];
  var SHIFT = 5;

  var st = { n: 0, total: 0, order: null, sauce: null, cheese: false, sel: "pep", placed: {}, stack: [], bake: 0, baking: false, cut: 0, mode: "" };
  var raf = 0;

  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function nameOf(list, k) { for (var i = 0; i < list.length; i++) { if (list[i].k === k) { return list[i].n; } } return k; }
  function mk(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) { e.setAttribute(k, attrs[k]); } return e; }

  /* ---------- pizza svg ---------- */
  var blobs = "";
  for (var b = 0; b < 14; b++) {
    var ba = Math.random() * 6.283, bd = Math.random() * 58;
    blobs += '<circle cx="' + (Math.cos(ba) * bd).toFixed(1) + '" cy="' + (Math.sin(ba) * bd).toFixed(1) + '" r="' + (6 + Math.random() * 8).toFixed(1) + '" fill="#ffe08a" opacity=".55"/>';
  }
  var wrap = document.createElement("div");
  wrap.innerHTML =
    '<svg id="pizza" viewBox="-100 -100 200 200" role="img" aria-label="Your pizza">' +
    '<circle r="96" cy="4" fill="rgba(0,0,0,.45)"/>' +
    '<circle id="crust" r="92" fill="#e2b46a" stroke="#a9772f" stroke-width="2"/>' +
    '<circle id="dough" r="80" fill="#f1d8a6"/>' +
    '<circle id="sauce" r="76" fill="#c0392b" opacity="0"/>' +
    '<g id="cheese" opacity="0"><circle r="72" fill="#f6d365" opacity=".92"/>' + blobs + '</g>' +
    '<g id="tp"></g>' +
    '<circle id="burn" r="92" fill="#6b3410" opacity="0" pointer-events="none"/>' +
    '<g id="cuts" stroke="#fff3c4" stroke-width="2.2" stroke-linecap="round" pointer-events="none"></g>' +
    '</svg>';
  var svg = wrap.firstChild;
  var elCrust = svg.querySelector("#crust"), elSauce = svg.querySelector("#sauce"), elCheese = svg.querySelector("#cheese");
  var elTp = svg.querySelector("#tp"), elBurn = svg.querySelector("#burn"), elCuts = svg.querySelector("#cuts");

  function mount(id) { $(id).appendChild(svg); }

  /* ---------- screens ---------- */
  var SCREENS = ["sStart", "sOrder", "sBuild", "sBake", "sCut", "sServe", "sEnd"];
  function show(id) {
    SCREENS.forEach(function (s) { $("#" + s).hidden = s !== id; });
    if (id !== "sBake") { cancelAnimationFrame(raf); }
  }
  function hud() { $("#hCust").textContent = Math.min(st.n, SHIFT) + " / " + SHIFT; $("#hScore").textContent = Math.round(st.total); }

  /* ---------- order ---------- */
  function newOrder() {
    var kinds = shuffle(TOPS).slice(0, 1 + Math.floor(Math.random() * 2)), tops = {};
    kinds.forEach(function (t) { tops[t.k] = 3 + Math.floor(Math.random() * 5); });
    var who = pick(CUSTOMERS);
    return { face: who[0], name: who[1], sauce: pick(SAUCES).k, cheese: Math.random() < 0.8, tops: tops, bake: pick(BAKES), cut: pick([4, 6, 8]) };
  }
  function topLine(o) {
    return TOPS.filter(function (t) { return o.tops[t.k]; }).map(function (t) { return o.tops[t.k] + " " + t.n.toLowerCase(); }).join(", ");
  }
  function shortTicket(o) {
    return nameOf(SAUCES, o.sauce) + " sauce · " + (o.cheese ? "cheese" : "no cheese") + " · " + topLine(o) + " · " + o.bake.n + " · " + o.cut + " slices";
  }
  function nextCustomer() {
    if (st.n >= SHIFT) { endShift(); return; }
    st.n++;
    st.order = newOrder();
    hud();
    var o = st.order;
    $("#oFace").textContent = o.face; $("#oName").textContent = o.name;
    $("#oTicket").innerHTML =
      "<p>Order for " + o.name + "</p><ul>" +
      "<li>" + nameOf(SAUCES, o.sauce) + " sauce</li>" +
      "<li>" + (o.cheese ? "With cheese" : "No cheese") + "</li>" +
      TOPS.filter(function (t) { return o.tops[t.k]; }).map(function (t) { return "<li>" + o.tops[t.k] + " × " + t.n + "</li>"; }).join("") +
      "<li>Baked " + o.bake.n + "</li>" +
      "<li>Cut into " + o.cut + " slices</li></ul>";
    show("sOrder");
  }

  /* ---------- build ---------- */
  function resetPizza() {
    st.sauce = null; st.cheese = false; st.placed = {}; st.stack = []; st.bake = 0; st.cut = 0;
    TOPS.forEach(function (t) { st.placed[t.k] = 0; });
    elTp.innerHTML = ""; elCuts.innerHTML = ""; elCuts.setAttribute("class", "");
    elSauce.setAttribute("opacity", "0"); elCheese.setAttribute("opacity", "0");
    elCrust.setAttribute("fill", "#e2b46a"); elBurn.setAttribute("opacity", "0");
  }
  function paintBuild() {
    var o = st.order;
    Array.prototype.forEach.call($("#sauces").children, function (c) { c.classList.toggle("on", c.getAttribute("data-k") === st.sauce); c.setAttribute("aria-pressed", c.getAttribute("data-k") === st.sauce ? "true" : "false"); });
    $("#bCheese").classList.toggle("on", st.cheese);
    $("#bCheese").setAttribute("aria-pressed", st.cheese ? "true" : "false");
    $("#bCheese").textContent = "Cheese: " + (st.cheese ? "on" : "off");
    Array.prototype.forEach.call($("#tops").children, function (c) {
      var k = c.getAttribute("data-k");
      c.classList.toggle("on", k === st.sel);
      c.setAttribute("aria-pressed", k === st.sel ? "true" : "false");
      c.querySelector("span.n").textContent = TOPS.filter(function (t) { return t.k === k; })[0].n + " " + st.placed[k] + (o.tops[k] ? "/" + o.tops[k] : "");
    });
  }
  function buildPalette() {
    var sb = $("#sauces"); sb.innerHTML = "";
    SAUCES.forEach(function (s) {
      var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.setAttribute("data-k", s.k);
      b.innerHTML = '<i class="dot" style="background:' + s.c + '"></i><span>' + s.n + " sauce</span>";
      b.addEventListener("click", function () {
        st.sauce = s.k; elSauce.setAttribute("fill", s.c); elSauce.setAttribute("opacity", "1"); paintBuild();
      });
      sb.appendChild(b);
    });
    var tb = $("#tops"); tb.innerHTML = "";
    TOPS.forEach(function (t) {
      var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.setAttribute("data-k", t.k);
      b.innerHTML = '<i class="dot" style="background:' + t.c + '"></i><span class="n"></span>';
      b.addEventListener("click", function () { st.sel = t.k; paintBuild(); });
      tb.appendChild(b);
    });
  }
  function drawTop(k, x, y) {
    var g = mk("g", { transform: "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") rotate(" + Math.floor(Math.random() * 360) + ")" });
    if (k === "pep") {
      g.appendChild(mk("circle", { r: 8, fill: "#b3122b", stroke: "#7d0c1d", "stroke-width": 1.5 }));
      g.appendChild(mk("circle", { cx: -2.5, cy: -2, r: 1.3, fill: "#e0525f" }));
      g.appendChild(mk("circle", { cx: 3, cy: 2.5, r: 1.3, fill: "#e0525f" }));
    } else if (k === "mush") {
      g.appendChild(mk("rect", { x: -2, y: 0, width: 4, height: 6, fill: "#d8c9aa" }));
      g.appendChild(mk("path", { d: "M-8.5 1 Q0 -11 8.5 1 Z", fill: "#e8dcc8", stroke: "#b9a98a", "stroke-width": 1.2 }));
    } else if (k === "olive") {
      g.appendChild(mk("circle", { r: 5, fill: "none", stroke: "#20202a", "stroke-width": 3.2 }));
    } else if (k === "pepper") {
      g.appendChild(mk("path", { d: "M-9 3 Q0 -10 9 3", fill: "none", stroke: "#3fa34d", "stroke-width": 3.6, "stroke-linecap": "round" }));
    } else {
      g.appendChild(mk("circle", { r: 7, fill: "none", stroke: "#e4cdf0", "stroke-width": 2.2 }));
      g.appendChild(mk("circle", { r: 3.2, fill: "none", stroke: "#e4cdf0", "stroke-width": 1.6 }));
    }
    elTp.appendChild(g);
    return g;
  }
  svg.addEventListener("click", function (e) {
    if (st.mode !== "build") { return; }
    var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    var m = svg.getScreenCTM(); if (!m) { return; }
    var p = pt.matrixTransform(m.inverse());
    if (Math.sqrt(p.x * p.x + p.y * p.y) > 80 || st.stack.length >= 40) { return; }
    st.stack.push({ k: st.sel, el: drawTop(st.sel, p.x, p.y) });
    st.placed[st.sel]++;
    paintBuild();
  });
  function startBuild() {
    resetPizza(); st.sel = "pep"; st.mode = "build";
    $("#bTicket").textContent = shortTicket(st.order);
    mount("#slotBuild"); paintBuild(); show("sBuild");
  }
  $("#bCheese").addEventListener("click", function () { st.cheese = !st.cheese; elCheese.setAttribute("opacity", st.cheese ? "1" : "0"); paintBuild(); });
  $("#bUndo").addEventListener("click", function () {
    var l = st.stack.pop(); if (!l) { return; }
    elTp.removeChild(l.el); st.placed[l.k]--; paintBuild();
  });
  $("#bClear").addEventListener("click", function () {
    elTp.innerHTML = ""; st.stack = []; TOPS.forEach(function (t) { st.placed[t.k] = 0; }); paintBuild();
  });

  /* ---------- bake ---------- */
  var STOPS = [[0, "#e2b46a"], [45, "#dba04c"], [62, "#c98530"], [80, "#9a5a1f"], [100, "#2a1409"]];
  function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
  function crustAt(p) {
    for (var i = 1; i < STOPS.length; i++) {
      if (p <= STOPS[i][0]) {
        var a = STOPS[i - 1], b = STOPS[i], t = (p - a[0]) / (b[0] - a[0]), x = hex(a[1]), y = hex(b[1]);
        return "rgb(" + [0, 1, 2].map(function (n) { return Math.round(x[n] + (y[n] - x[n]) * t); }).join(",") + ")";
      }
    }
    return STOPS[STOPS.length - 1][1];
  }
  function bakeLabel(p) {
    return p < 20 ? "Raw" : p < 40 ? "Barely warm" : p < 55 ? "Light" : p < 70 ? "Golden" : p < 90 ? "Crispy" : p < 100 ? "Dark!" : "Burnt!";
  }
  function paintBake() {
    var p = st.bake;
    elCrust.setAttribute("fill", crustAt(p));
    elBurn.setAttribute("opacity", p >= 100 ? 0.85 : Math.min(0.5, p / 100 * 0.45));
    $("#fill").style.width = Math.min(100, p) + "%";
    $("#kLabel").textContent = bakeLabel(p);
  }
  function startBake() {
    st.mode = "bake"; st.bake = 0; st.baking = true;
    $("#kTicket").textContent = "Bake it " + st.order.bake.n + ". Pull it out inside the green zone.";
    var t = st.order.bake.t; $("#zone").style.left = (t - 10) + "%"; $("#zone").style.width = "20%";
    mount("#slotBake"); show("sBake"); paintBake();
    var last = 0;
    function tick(ts) {
      if (!st.baking) { return; }
      var d = Math.min(0.1, (ts - (last || ts)) / 1000); last = ts;
      st.bake = Math.min(100, st.bake + d * 13);
      paintBake();
      if (st.bake >= 100) { st.baking = false; setTimeout(startCut, 900); return; }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
  }
  $("#bPull").addEventListener("click", function () {
    if (!st.baking) { return; }
    st.baking = false; cancelAnimationFrame(raf); startCut();
  });

  /* ---------- cut ---------- */
  var ANG = { 4: [0, 90], 6: [0, 60, 120], 8: [0, 45, 90, 135] };
  function drawCuts(n, preview) {
    elCuts.innerHTML = "";
    ANG[n].forEach(function (a) {
      var l = mk("line", { x1: -92, y1: 0, x2: 92, y2: 0, transform: "rotate(" + a + ")" });
      elCuts.appendChild(l);
    });
    elCuts.setAttribute("class", preview ? "preview" : "draw");
  }
  function startCut() {
    st.mode = "cut"; st.cut = 0; elCuts.innerHTML = ""; elCuts.setAttribute("class", "");
    $("#cTicket").textContent = "Cut it into " + st.order.cut + " slices.";
    var box = $("#cutOpts"); box.innerHTML = "";
    [4, 6, 8].forEach(function (n) {
      var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = n + " slices"; b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () {
        st.cut = n; drawCuts(n, true);
        Array.prototype.forEach.call(box.children, function (c) { c.classList.toggle("on", c === b); c.setAttribute("aria-pressed", c === b ? "true" : "false"); });
      });
      box.appendChild(b);
    });
    mount("#slotCut"); show("sCut");
  }
  $("#bCut").addEventListener("click", function () {
    if (!st.cut) { $("#cTicket").textContent = "Pick how many slices first."; return; }
    drawCuts(st.cut, false); st.mode = "";
    setTimeout(serve, 800);
  });

  /* ---------- serve ---------- */
  function grade() {
    var o = st.order, s = {};
    s.sauce = st.sauce === o.sauce ? 100 : 0;
    s.cheese = st.cheese === o.cheese ? 100 : 0;
    var parts = [];
    TOPS.forEach(function (t) {
      var need = o.tops[t.k] || 0, got = st.placed[t.k] || 0;
      if (need > 0) { parts.push(Math.max(0, 100 - 25 * Math.abs(got - need))); }
      else if (got > 0) { parts.push(0); }
    });
    s.tops = parts.length ? parts.reduce(function (a, b) { return a + b; }, 0) / parts.length : 100;
    s.bake = st.bake >= 100 ? 0 : Math.max(0, 100 - 4 * Math.abs(st.bake - o.bake.t));
    s.cut = st.cut === o.cut ? 100 : 0;
    s.total = 0.15 * s.sauce + 0.15 * s.cheese + 0.4 * s.tops + 0.2 * s.bake + 0.1 * s.cut;
    return s;
  }
  function serve() {
    var s = grade(), o = st.order;
    st.total += s.total; hud();
    var stars = Math.max(0, Math.min(5, Math.round(s.total / 20)));
    $("#rFace").textContent = s.total >= 60 ? o.face : "😠"; $("#rName").textContent = o.name;
    $("#rStars").textContent = new Array(stars + 1).join("★") + new Array(6 - stars).join("☆");
    $("#rSay").textContent =
      s.total >= 95 ? "Flawless. I'd sell my soul for another." :
      s.total >= 80 ? "Devilishly good. Keep the change." :
      s.total >= 60 ? "Not bad for a hotel kitchen." :
      s.total >= 40 ? "This is not what I ordered." : "I want to speak to the manager.";
    var rows = [
      ["Sauce", s.sauce >= 100 ? "Right" : "Wrong"],
      ["Cheese", s.cheese >= 100 ? "Right" : "Wrong"],
      ["Toppings", Math.round(s.tops) + "%"],
      ["Bake", st.bake >= 100 ? "Burnt" : Math.round(s.bake) + "%"],
      ["Slices", s.cut >= 100 ? "Right" : "Wrong"]
    ];
    $("#rBreak").innerHTML = rows.map(function (r) { return "<li><span>" + r[0] + "</span><span>" + r[1] + "</span></li>"; }).join("");
    $("#bNext").textContent = st.n >= SHIFT ? "See results" : "Next customer";
    show("sServe");
  }
  function endShift() {
    var avg = st.total / SHIFT;
    $("#eScore").textContent = Math.round(st.total) + " / " + (SHIFT * 100);
    $("#eRank").textContent =
      avg >= 90 ? "Head chef of Hell. The hotel has a new favorite." :
      avg >= 75 ? "Line cook from the lowest circle. Solid shift." :
      avg >= 55 ? "Apprentice. The customers lived." : "Kitchen disaster. The oven is still on fire.";
    show("sEnd");
  }

  $("#bStart").addEventListener("click", function () { st.n = 0; st.total = 0; hud(); nextCustomer(); });
  $("#bCook").addEventListener("click", startBuild);
  $("#bOven").addEventListener("click", startBake);
  $("#bNext").addEventListener("click", nextCustomer);
  $("#bAgain").addEventListener("click", function () { st.n = 0; st.total = 0; hud(); nextCustomer(); });

  buildPalette(); hud(); show("sStart");
  window.__pz = { st: st, grade: grade };
})();
</script>
</body>
</html>
